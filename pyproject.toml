[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "clinical-llm-reasoning"
version = "0.1.0.dev0"
description = "Graph-guided LLM reasoning over clinical text: eligibility reasoning, calibrated uncertainty, explainable decision paths."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fan Zhou" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "pandas>=2.1",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clinreason"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Executed exploration notebooks are outputs; their generator scripts are linted.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
